name: Build and Release Android App

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm, Node.js and install dependencies
        uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@lts
          cache: true

      - name: Install Capacitor
        run: pnpm add @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Build app
        run: pnpm run build

      - name: Add Android platform
        run: pnpm exec cap add android

      - name: Generate Icons
        run: pnpm exec capacitor-assets generate --iconBackgroundColor "#FFFFFF"

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Android app
        run: cd android && ./gradlew assembleDebug

      - name: Verify APK file
        run: ls -lh android/app/build/outputs/apk/debug/

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./android/app/build/outputs/apk/debug/app-debug.apk
            ./android/app/build/outputs/apk/debug/output-metadata.json
